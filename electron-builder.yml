# Packages Hoot. `pnpm app:release` builds what a release ships, in release/: a DMG and
# a zip of Hoot.app for Apple Silicon and for Intel Macs, signed and notarized, the
# Windows installer, and the update files that list them. `pnpm app:package` builds only
# a Hoot.app for the Mac it runs on, and `pnpm app:install` also installs it in
# /Applications.
appId: dev.hootcode.app
productName: Hoot
directories:
  output: release
# Vite bundles the app into dist/ and dist-electron/. The only package loaded at run
# time is node-pty, the one entry in "dependencies", which electron-builder adds.
files:
  - dist/**/*
  - dist-electron/**/*
# The launchers of hoot, the command line program of Hoot's sessions, which
# Hoot puts first on their PATH: files of their own, which shells can run.
extraResources:
  - from: resources/bin
    to: bin
# node-pty ships prebuilt Node-API binaries, which Electron loads as they are.
npmRebuild: false
# The package's name as the app has it. The Windows installer names Hoot's folder,
# %LOCALAPPDATA%\Programs\Hoot, after it; Electron takes the app's name from
# productName instead.
extraMetadata:
  name: Hoot
mac:
  category: public.app-category.developer-tools
  # Made with Icon Composer. It is compiled into the app for macOS 26 and later, and
  # turned into an .icns for earlier versions, which needs Xcode 26 or later.
  icon: build/icon.icon
  # The app is signed with a "Developer ID Application" certificate: the one CSC_LINK
  # gives, or the keychain's. `pnpm app:release` also notarizes it, with the
  # credentials named in package.json; `pnpm app:package` does not.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
# Installs Hoot for the current user only, in %LOCALAPPDATA%\Programs\Hoot, without
# options to pick and without asking for administrator rights. It is not signed.
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
# Where releases go. electron-builder publishes nothing itself (the release workflow
# drafts the release); this makes it write the files Hoot reads to update itself:
# <channel>-mac.yml and <channel>.yml, which list a release's files, the channel being
# the prerelease tag of the version, such as alpha, or latest for a version without
# one; and app-update.yml, which says where the releases are, in the apps that the DMG,
# the zip and the Windows installer hold. The app `pnpm app:package` builds has none, so
# it does not update itself. For GitHub, electron-builder takes the channel from the
# version only when it is set this way.
publish:
  provider: github
  owner: Levix0501
  repo: hoot
  channel: ${channel}
